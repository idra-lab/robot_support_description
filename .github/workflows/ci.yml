name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:humble-desktop
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS environment
        run: |
          . /opt/ros/humble/setup.bash
          echo "ROS_DISTRO=humble" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          . /opt/ros/humble/setup.bash
          apt-get update
          rosdep update
          rosdep install --from-paths . --ignore-src -y

      - name: Build package
        run: |
          . /opt/ros/humble/setup.bash
          colcon build --packages-select robot_support_description

      - name: Run tests
        run: |
          . /opt/ros/humble/setup.bash
          colcon test --packages-select robot_support_description

      - name: Validate xacro files
        run: |
          . /opt/ros/humble/setup.bash
          . install/setup.bash
          python3 test/test_urdf_validation.py

      - name: Parse URDF files
        run: |
          . /opt/ros/humble/setup.bash
          . install/setup.bash
          apt-get install -y python3-lxml
          python3 test/test_urdf_validation.py

      - name: Test launch files
        run: |
          . /opt/ros/humble/setup.bash
          . install/setup.bash
          
          echo "Testing kuka_pedestal launch..."
          timeout 5 ros2 launch launch/display.launch.py pedestal_model:=kuka_pedestal || true
          
          echo "Testing ur_table launch..."
          timeout 5 ros2 launch launch/display.launch.py pedestal_model:=ur_table || true
